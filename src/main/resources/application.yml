server:
  port: 8086

spring:
  application:
    name: basketball-api

  datasource:
    url: jdbc:mysql://localhost:3310/basketball
    username: root
    password: secret

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

balldontlie:
  base-url: https://api.balldontlie.io/v1
  api-key: ${BALLDONTLIE_API_KEY}